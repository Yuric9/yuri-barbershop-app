name: Production Login Verification Test

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify-login:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Try login with registration test account
        shell: bash
        run: |
          set -euo pipefail
          origin="https://yuri-barbershop-app.jesika-yure.workers.dev"
          email="__test_login_cadastro__@cadastro.local"
          password="TesteLogin2026!"

          login_code=$(curl -sS -c /tmp/cookies.txt -o /tmp/login.json -w '%{http_code}' \
            -X POST "$origin/api/auth/login" \
            -H "origin: $origin" \
            -H "content-type: application/json" \
            --data "{\"email\":\"$email\",\"password\":\"$password\",\"area\":\"client\"}")
          echo "login_status=$login_code"
          cat /tmp/login.json || true
          echo
          if [ "$login_code" = "200" ]; then
            exit 0
          fi
          exit 1
