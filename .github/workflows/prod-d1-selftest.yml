name: Production D1 Final Diagnostic

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  diagnose-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for isolated registration diagnostic and execute tests
        shell: bash
        run: |
          set -euo pipefail
          url="https://yuri-barbershop-app.jesika-yure.workers.dev/api/d1-selftest"
          echo "Waiting for isolated registration diagnostic..."
          for i in $(seq 1 54); do
            code=$(curl -sS -o /tmp/result.json -w '%{http_code}' --max-time 15 "$url" || true)
            body=$(cat /tmp/result.json 2>/dev/null || true)
            echo "attempt=$i status=$code"
            if printf '%s' "$body" | grep -Fq 'isolatedRateLimit'; then
              echo "$body"
              if [ "$code" = "200" ]; then exit 0; else exit 1; fi
            fi
            sleep 10
          done
          echo "Latest diagnostic route was not observed in time"
          cat /tmp/result.json 2>/dev/null || true
          exit 2
